name: Build HappyToHelp delivery artifact

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # pnpm verify alone takes about 60 minutes on a 2-vCPU runner (Verify, 0.4.0).
    timeout-minutes: 90
    # Production authority belongs to the independent delivery service.
    # Do not attach an environment, production secret or id-token permission.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - name: Prepare space for native server verification
        # As in Verify: rer's disk guard refuses the native journey on a
        # 2-vCPU runner otherwise. The app does not use the Android SDK.
        run: |
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          sudo rm -rf -- /usr/local/lib/android
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - run: pnpm test:mobile-inbox-browser
      - run: pnpm test:reproducible-build
      - uses: actions/upload-artifact@v4
        with:
          name: happytohelp-worker-${{ github.sha }}
          path: delivery-artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failed native runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-failure-${{ github.sha }}
          path: /tmp/h2h-native-runtime-*/runtime.log
          if-no-files-found: ignore
          retention-days: 7
