name: Build HappyToHelp delivery artifact

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Production authority belongs to the independent delivery service.
    # Do not attach an environment, production secret or id-token permission.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - run: node scripts/build-delivery-artifact.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: happytohelp-worker-${{ github.sha }}
          path: delivery-artifact/happytohelp-worker-artifact.json
          if-no-files-found: error
          retention-days: 14
