name: Managed release
on:
  workflow_dispatch:
    inputs:
      installation_id:
        description: RER installation identifier
        required: true
        type: string
      broker_url:
        description: RER management origin
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        default: preview
        type: choice
        options: [preview, production]
      verification_profile:
        description: Verification scope for this release
        required: true
        default: full
        type: choice
        options: [full, visual]
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  release:
    uses: runeditrun/delivery/.github/workflows/trusted-build.yml@6c13583c47248ef30281c2d91686d37364cbe06b
    with:
      installation_id: ${{ inputs.installation_id }}
      broker_url: ${{ inputs.broker_url }}
      environment: ${{ inputs.environment }}
      verification_profile: ${{ inputs.verification_profile }}
      pnpm_version: '10.12.4'
      artifact_file: happytohelp-worker-artifact.json
