name: Managed release
on:
  workflow_dispatch:
    inputs:
      installation_id:
        description: RER installation identifier
        required: true
        type: string
      broker_url:
        description: RER management origin
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        default: preview
        type: choice
        options: [preview, production]
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  release:
    uses: runeditrun/delivery/.github/workflows/trusted-build.yml@0cf164a93b20803294fd3a568508cdf23e65f7de
    with:
      installation_id: ${{ inputs.installation_id }}
      broker_url: ${{ inputs.broker_url }}
      environment: ${{ inputs.environment }}
      pnpm_version: '10.12.4'
      artifact_file: happytohelp-worker-artifact.json
