name: Verify

on:
  push:
    branches: [main, release/0.3.x, release/0.4.x]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Verification needs no repository secrets or deployment credentials.
    env:
      WRANGLER_SEND_METRICS: 'false'
      H2H_PREVIEW_ORIGIN: http://127.0.0.1:5186
    steps:
      - name: Configure evidence directory
        run: echo "H2H_EVIDENCE_DIR=$RUNNER_TEMP/happytohelp-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - name: Prepare space for native server verification
        # This Node/Worker app does not use the preinstalled Android SDK.
        # Keep the real rer disk guard on this ephemeral runner.
        run: |
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          sudo rm -rf -- /usr/local/lib/android
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer describe
      - run: node scripts/edition-authoring/cli.mjs check
      - run: pnpm exec playwright install --with-deps chromium
      - id: verify
        run: pnpm run verify

      - name: Native HTTP transport and proxy cause regression
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: pnpm run test:runtime-transport

      # Every browser suite runs after a passing verify, even when an earlier
      # browser suite fails, so one run reports every browser regression.
      - name: Widget browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: pnpm run test:widget-browser
      - name: Launcher pointer send and inbox defaults
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: pnpm run test:widget-pointer-send-browser && pnpm run test:inbox-default-browser
      - name: Widget opening contrast browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: H2H_EVIDENCE_DIR="$H2H_EVIDENCE_DIR/widget-opening-contrast" pnpm run test:widget-opening-contrast-browser
      - name: Widget lifecycle browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: pnpm run test:widget-lifecycle-browser
      - name: UI browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: pnpm run test:ui-browser
      - name: Busy note synchronous focus browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: H2H_EVIDENCE_DIR="$H2H_EVIDENCE_DIR/note-busy-focus" pnpm run test:note-busy-focus-browser
      - name: Navigation browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: pnpm run test:navigation-browser
      - name: Public Help Center browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: pnpm run test:public-help-center-browser
      - name: Docs browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: H2H_EVIDENCE_DIR="$H2H_EVIDENCE_DIR/docs" pnpm run test:docs-browser
      - name: Setup browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: pnpm run test:setup-browser
      - name: Demo inbox browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: pnpm run test:demo-inbox-browser
      - name: Mobile inbox browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: pnpm run test:mobile-inbox-browser
      - name: Conversation panel resize browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: pnpm run test:conversation-panel-resize-browser
      - name: Contact erasure browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: pnpm run test:contact-erasure-browser

      - name: Real local connector hero browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: pnpm run test:hero-connector-browser
      - name: Assistant draft handoff browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: H2H_EVIDENCE_DIR="$H2H_EVIDENCE_DIR/assistant-draft-handoff" pnpm run test:assistant-draft-handoff-browser
      - name: Native local draft adoption browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: H2H_EVIDENCE_DIR="$H2H_EVIDENCE_DIR/local-draft-adoption" pnpm run test:local-draft-adoption-browser
      - name: Assistant draft readiness browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: H2H_EVIDENCE_DIR="$H2H_EVIDENCE_DIR/assistant-draft-readiness" pnpm run test:assistant-draft-readiness-browser
      - name: Durable provider error browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: pnpm run test:provider-errors-browser
      - name: Shared appearance and recovery browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: pnpm run test:appearance-browser
      - name: Article readiness and workspace transition browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: pnpm run test:ui-readiness-browser
      - name: Training readiness browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: pnpm run test:training-readiness-browser
      - name: Explicit magic sign-in browser suite
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: pnpm run test:magic-link-browser

      - name: Start local native preview
        id: preview
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: |
          node --input-type=module -e 'import {mkdir,writeFile} from "node:fs/promises"; import {randomBytes} from "node:crypto"; await mkdir(".seed",{recursive:true,mode:0o700}); await writeFile(".seed/native-preview-answers.json",JSON.stringify({WORKSPACE_NAME:"CI preview",WIDGET_ORIGIN:"https://example.test",PRIMARY_COLOR:"#7c3aed",OWNER_NAME:"CI owner",OWNER_PASSWORD:randomBytes(24).toString("base64url"),EMAIL_PROVIDER:"later"}),{mode:0o600});'
          pnpm exec rer setup --owner-email ci-preview@example.test --answers .seed/native-preview-answers.json --port 5186 --non-interactive
          nohup pnpm exec rer preview --port 5186 --non-interactive > "$RUNNER_TEMP/native-preview.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS "$H2H_PREVIEW_ORIGIN/health"; then exit 0; fi
            sleep 2
          done
          echo "Local native preview did not become healthy" >&2
          exit 1
      - name: Homepage browser check
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: H2H_TEST_ORIGIN="$H2H_PREVIEW_ORIGIN" node tests/homepage-browser.mjs
      - name: Public site runtime check
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: H2H_TEST_ORIGIN="$H2H_PREVIEW_ORIGIN" node tests/public-site-runtime.mjs
      - name: Stop local native preview
        if: ${{ always() && steps.preview.outcome != 'skipped' }}
        run: |
          pnpm exec rer preview --stop --non-interactive

      - name: Confirm verification preserves source
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"

      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/happytohelp-evidence
          if-no-files-found: ignore
          retention-days: 14
      # Only fixture-backed local runtime logs; no build artifact or secret is uploaded.
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/h2h-native-runtime-*/runtime.log
            /tmp/h2h-independent-*/runtime.log
            ${{ runner.temp }}/native-preview.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7
