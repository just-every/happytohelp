name: Verify

on:
  push:
    branches: [main, release/0.3.x, release/0.4.x]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only generated, public build output is shared; no local state or secrets.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer describe
      - run: node scripts/edition-authoring/cli.mjs check
      - run: pnpm exec rer check --profile first-party
      - run: pnpm run build
      - name: Package internal build output
        run: >-
          tar -czf "$RUNNER_TEMP/happytohelp-build.tar.gz"
          dist delivery-artifact .generated migrations/core public/widget.js public/downloads src/routeTree.gen.ts
      - uses: actions/upload-artifact@v4
        with:
          name: verify-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/happytohelp-build.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Confirm build preserves source
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload build failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/h2h-native-runtime-*/runtime.log
            /tmp/h2h-independent-*/runtime.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  checks:
    needs: build
    name: Verify / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: modules-1
            commands: |
              node scripts/ci/node-tests.mjs modules 1/4
          - name: modules-2
            commands: |
              node scripts/ci/node-tests.mjs modules 2/4
          - name: modules-3
            commands: |
              node scripts/ci/node-tests.mjs modules 3/4
          - name: modules-4
            commands: |
              node scripts/ci/node-tests.mjs modules 4/4
          - name: contracts
            commands: |
              pnpm run typecheck
              pnpm run source:check
              node scripts/edition-authoring/cli.mjs verify-base --offline
              node --test tests/independent-contract.mjs tests/homepage-source.mjs tests/docs-site.mjs tests/docs-dev-sync.mjs
          - name: activation-and-local-mail
            commands: |
              pnpm run test:activation
              pnpm run test:activation-spend
              node scripts/ci/node-tests.mjs test:first-run
          - name: move-in-contracts-1
            commands: |
              node scripts/ci/node-tests.mjs test:move-in 1/4
          - name: move-in-contracts-2
            commands: |
              node scripts/ci/node-tests.mjs test:move-in 2/4
          - name: move-in-contracts-3
            commands: |
              node scripts/ci/node-tests.mjs test:move-in 3/4
          - name: move-in-contracts-4
            commands: |
              node scripts/ci/node-tests.mjs test:move-in 4/4
          - name: reports-and-recovery
            commands: |
              node scripts/ci/node-tests.mjs test:reports
              node tests/reports/upgrade.mjs
              node tests/recovery-m9.mjs
          - name: connections
            commands: |
              node scripts/ci/node-tests.mjs test:connections
              node tests/connections/artifact.mjs
              node tests/independent-runtime.mjs
          - name: native-runtime
            commands: |
              pnpm run test:runtime
          - name: native-transport
            commands: |
              pnpm run test:runtime-transport
          - name: native-journeys
            commands: |
              pnpm run test:journey
              node tests/delegation-journey.mjs
          - name: move-in-capacity
            commands: |
              node tests/move-in/capacity.mjs
          - name: business-browsers
            commands: |
              node tests/move-in/browser.mjs
              node tests/reports/browser.mjs
              node tests/connections/browser.mjs
          - name: first-run-browser
            commands: |
              node tests/first-run/browser.mjs
          - name: visitor-profile-browser
            commands: |
              node tests/first-run/dashboard-browser.mjs
              node tests/first-run/profile-browser.mjs
          - name: workspace-browsers
            commands: |
              pnpm run test:widget-settings-browser
              pnpm run test:inbox-conversation-browser
              pnpm run test:workspace-shell-browser
              pnpm run test:navigation-browser
          - name: widget-browsers
            commands: |
              pnpm run test:widget-browser
              pnpm run test:widget-pointer-send-browser
              pnpm run test:inbox-default-browser
              pnpm run test:widget-opening-contrast-browser
              pnpm run test:widget-lifecycle-browser
          - name: inbox-browsers
            commands: |
              pnpm run test:ui-browser
              pnpm run test:note-busy-focus-browser
              pnpm run test:conversation-panel-resize-browser
              pnpm run test:contact-erasure-browser
          - name: public-and-setup-browsers
            commands: |
              pnpm run test:public-help-center-browser
              pnpm run test:docs-browser
              pnpm run test:setup-browser
              pnpm run test:demo-inbox-browser
              pnpm run test:mobile-inbox-browser
          - name: connector-browsers
            commands: |
              pnpm run test:hero-connector-browser
              pnpm run test:assistant-draft-handoff-browser
              pnpm run test:local-draft-adoption-browser
              pnpm run test:assistant-draft-readiness-browser
          - name: readiness-browsers
            commands: |
              pnpm run test:provider-errors-browser
              pnpm run test:appearance-browser
              pnpm run test:ui-readiness-browser
              pnpm run test:training-readiness-browser
              pnpm run test:magic-link-browser
    steps:
      - name: Configure evidence directory
        run: echo "H2H_EVIDENCE_DIR=$RUNNER_TEMP/happytohelp-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: verify-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-build
      - name: Restore the build from this workflow's exact checkout
        run: tar -xzf "$RUNNER_TEMP/verify-build/happytohelp-build.tar.gz"
      - run: pnpm exec playwright install --with-deps chromium
      # Every command in a shard runs even after another check fails.
      - name: Run shard checks
        env:
          H2H_CI_COMMANDS: ${{ matrix.commands }}
        run: node scripts/ci/run-checks.mjs
      - name: Confirm checks preserve source
        if: ${{ !cancelled() }}
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/happytohelp-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/h2h-native-runtime-*/runtime.log
            /tmp/h2h-independent-*/runtime.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  public-preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      H2H_PREVIEW_ORIGIN: http://127.0.0.1:5186
    steps:
      - name: Configure evidence directory
        run: echo "H2H_EVIDENCE_DIR=$RUNNER_TEMP/happytohelp-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - name: Prepare space for native preview
        run: |
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          sudo rm -rf -- /usr/local/lib/android
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start local native preview
        id: preview
        run: |
          node --input-type=module -e 'import {mkdir,writeFile} from "node:fs/promises"; import {randomBytes} from "node:crypto"; await mkdir(".seed",{recursive:true,mode:0o700}); await writeFile(".seed/native-preview-answers.json",JSON.stringify({WORKSPACE_NAME:"CI preview",WIDGET_ORIGIN:"https://example.test",PRIMARY_COLOR:"#7c3aed",OWNER_NAME:"CI owner",OWNER_PASSWORD:randomBytes(24).toString("base64url"),EMAIL_PROVIDER:"later"}),{mode:0o600});'
          pnpm exec rer setup --owner-email ci-preview@example.test --answers .seed/native-preview-answers.json --port 5186 --non-interactive
          nohup pnpm exec rer preview --port 5186 --non-interactive > "$RUNNER_TEMP/native-preview.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS "$H2H_PREVIEW_ORIGIN/health"; then exit 0; fi
            sleep 2
          done
          echo "Local native preview did not become healthy" >&2
          exit 1
      - name: Homepage and public site checks
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        env:
          H2H_TEST_ORIGIN: ${{ env.H2H_PREVIEW_ORIGIN }}
          H2H_CI_COMMANDS: |
            node tests/homepage-browser.mjs
            node tests/public-site-runtime.mjs
        run: node scripts/ci/run-checks.mjs
      - name: Stop local native preview
        if: ${{ always() && steps.preview.outcome != 'skipped' }}
        run: pnpm exec rer preview --stop --non-interactive
      - name: Confirm preview preserves source
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-public-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/happytohelp-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-public-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/h2h-native-runtime-*/runtime.log
            /tmp/h2h-independent-*/runtime.log
            ${{ runner.temp }}/native-preview.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7
